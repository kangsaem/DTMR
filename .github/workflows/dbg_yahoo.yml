name: dbg-yahoo

# 야후 chart API 원본 응답 점검(dbg_yahoo.py, 2026-11-19) — 머니파이 지수 카드 그래프 점검용
on:
  workflow_dispatch:
    inputs:
      sym:
        description: "심볼(예: ^IXIC)"
        required: true
        default: "^IXIC"
      range:
        description: "기간(1d·2d)"
        required: false
        default: "1d"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 직접
        run: python dbg_yahoo.py "${{ github.event.inputs.sym }}" "${{ github.event.inputs.range }}" 2m
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/dbg_yahoo_*.json
          git commit -q -m "dbg yahoo" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
