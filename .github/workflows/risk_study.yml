name: risk-study

# 위험·바닥 지표 항목별 검증(risk_study.py, 2026-11-16) — VIX가 위험 쪽인지 바닥 쪽인지. 리포트 재실행 없음
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 검증
        run: python risk_study.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/risk_study.txt results/risk_study.json
          git commit -q -m "위험·바닥 항목 검증 결과" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && exit 0; sleep 5; done
          exit 1
